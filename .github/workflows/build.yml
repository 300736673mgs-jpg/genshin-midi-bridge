name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --name Genshin-MIDI-Bridge --collect-all rtmidi app.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        run: ISCC.exe installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Genshin-MIDI-Bridge-Windows
          path: |
            dist/Genshin-MIDI-Bridge.exe
            dist/Genshin-MIDI-Bridge-Setup.exe
      - name: Attach files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Genshin-MIDI-Bridge.exe
            dist/Genshin-MIDI-Bridge-Setup.exe
